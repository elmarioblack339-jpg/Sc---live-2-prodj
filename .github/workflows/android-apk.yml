name: Build SC LIVE 2 APK
on:
  push:
    branches: [sc-live2-build, sc-live2-rebuild-clean, sc-live2-punto-gasolina, sc-live2-rank-stems-browser-rec, sc-live2-audio-recovery-test, sc-live2-audio-recovery-newapp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
      - name: Fetch pinned Demucs Android engine and Eigen
        run: |
          mkdir -p third_party
          git clone https://github.com/jPaauwe/demucs-android.git third_party/demucs-android
          git -C third_party/demucs-android checkout f4bc42b6c209beea2aa4a04d37c75cd06b0c90d2
          git -C third_party/demucs-android submodule update --init --recursive
          test -s third_party/demucs-android/third_party/eigen/Eigen/Dense
          test -s third_party/demucs-android/android/jni/sdengine_jni.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require the original APK source
        run: |
          test -s rebuild-reference/original-apk/assets/index.html || {
            echo "::error::The exact source extracted from the 2,247,521-byte reference APK is required."
            exit 1
          }
          test -s app/src/main/assets/index.html || {
            echo "::error::The working SC LIVE 2 interface is missing."
            exit 1
          }
          grep -q 'ampFaceplate' app/src/main/assets/index.html || {
            echo "::error::The functional SC AMPLIFICATION front-panel interface is missing."
            exit 1
          }
          grep -q 'ampLowVolumeDial' app/src/main/assets/index.html
          grep -q 'ampHighVolumeDial' app/src/main/assets/index.html
          grep -q 'class="ampFaceBrand">SC AMPLIFICATION' app/src/main/assets/index.html
          grep -q 'ampLowMeter' app/src/main/assets/index.html
          grep -q 'ampHighMeter' app/src/main/assets/index.html
          grep -q "M.drBands=\[\['LOW 1'" app/src/main/assets/index.html
          grep -q 'M.drBands.forEach' app/src/main/assets/index.html
          grep -q 'band.hp.connect(band.lp)' app/src/main/assets/index.html
          grep -q 'bandLowHz' app/src/main/java/com/sclive2/dj/ScLiveDspAudioProcessor.kt
          grep -q 'outputGainsDb' app/src/main/java/com/sclive2/dj/ScLiveDspAudioProcessor.kt
          grep -q 'crossoverSlope' app/src/main/java/com/sclive2/dj/ScLiveDspAudioProcessor.kt
          grep -q 'crossoverHz' app/src/main/java/com/sclive2/dj/ScLiveDspAudioProcessor.kt
          grep -q 'advancedSettingsLock' app/src/main/assets/index.html
          grep -q 'eqMode.*parametric' app/src/main/assets/index.html
          grep -q 'id="sourceAssistPanel"' app/src/main/assets/index.html
          grep -q 'requestMicPermission' app/src/main/assets/index.html
          grep -q 'onPermissionRequest' app/src/main/java/com/sclive2/dj/MainActivity.kt
          grep -q 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          grep -q 'separateLowHighOutput' app/src/main/java/com/sclive2/dj/ScLiveDspAudioProcessor.kt
          grep -q 'M.drStereoGain.connect(M.drOut)' app/src/main/assets/index.html
          grep -q 'SC RACK · DSP / DRIVE RACK 260' app/src/main/assets/index.html
          if grep -q 'MTE AUDIO\|MTE CA32\|dbx' app/src/main/assets/index.html; then
            echo "::error::Legacy amplifier or processor branding remains in the interface."
            exit 1
          fi
          if grep -q 'id="ampBassCut"\|id="ampMidBassCut"\|id="ampMidCut"\|id="ampTrebleCut"' app/src/main/assets/index.html; then
            echo "::error::The old manual band-cut controls must not return."
            exit 1
          fi
          if grep -q 'mte-ca32.webp\|ampHardware' app/src/main/assets/index.html; then
            echo "::error::A decorative amplifier photo must not be used."
            exit 1
          fi
      - name: Validate embedded SC LIVE 2 JavaScript and REC bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript was found")
          Path("/tmp/sc-live2-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          if "recChunks" in html or "NativeAudio.saveRecording" in html:
              raise SystemExit("The old whole-session in-memory REC implementation returned")
          for method in ("beginRecording", "appendRecordingChunk", "finishRecording"):
              if f"NativeAudio.{method}" not in html:
                  raise SystemExit(f"Missing streaming REC bridge call: {method}")
          PY
          node --check /tmp/sc-live2-inline.js
          grep -q 'fun beginRecording' app/src/main/java/com/sclive2/dj/MainActivity.kt
          grep -q 'fun appendRecordingChunk' app/src/main/java/com/sclive2/dj/MainActivity.kt
          grep -q 'fun finishRecording' app/src/main/java/com/sclive2/dj/MainActivity.kt
          grep -q 'nativeSeparate' app/src/main/java/com/sclive2/dj/NativeEngine.kt
      - name: Validate Browser session preservation
        run: python3 scripts/validate-browser-session.py
      - name: Build debug APK (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --refresh-dependencies assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency fetch failed; retrying in 15 seconds (attempt $attempt/3)"
              sleep 15
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-LIVE-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
