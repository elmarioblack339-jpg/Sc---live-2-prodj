name: Build SC LIVE 2 APK
on:
  push:
    branches: [sc-live2-amp-reference-step1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify the committed app asset (do not overwrite it)
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'id="dr260Photo"' app/src/main/assets/index.html
          grep -q 'dbx DriveRack 260' app/src/main/assets/index.html
          grep -q 'bassAnalyser' app/src/main/assets/index.html
          grep -q 'midBassAnalyser' app/src/main/assets/index.html
          grep -q 'midAnalyser' app/src/main/assets/index.html
          grep -q 'trebleAnalyser' app/src/main/assets/index.html
          if grep -qi 'PA2' app/src/main/assets/index.html; then
            echo "::error::Obsolete PA2 reference found"
            exit 1
          fi
      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-LIVE-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
