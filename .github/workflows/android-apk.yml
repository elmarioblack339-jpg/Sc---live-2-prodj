name: Build SC LIVE 2 APK
on:
  push:
    branches: [sc-live2-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --refresh-dependencies assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency fetch failed; retrying in 15 seconds (attempt $attempt/3)"
              sleep 15
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-LIVE-2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
